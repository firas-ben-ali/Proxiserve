<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxiserve - Reset Password</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Icônes Material Design -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <nav>
                <ul>
                    <li><a href="../index.html"><span class="material-icons"> home</span>Home</a></li>
                    <li><a href="#"><span class="material-icons"> info</span>About Us</a></li>
                    <li><a href="#"><span class="material-icons"> help</span>Help</a></li>
                </ul>
            </nav>
            <div class="welcome-message">
                <h1>Reset your password to regain access to your account.</h1>
            </div>
            
            
            <!--background images-->
            <div class="header-background" id="headerBackground">
                <!-- Background images will be inserted here by JavaScript-->
            </div>
            <div class="header-overlay"></div>



        </div>
        <div class="right-section">
            <div class="reset-form">
                <h2>Reset Your Password</h2>
                <p class="reset-description">Enter your email address and we'll send you a link to reset your password.</p>
                <form id="resetForm">
                    <div class="form-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="reset-btn">Send Reset Link</button>
                    <a href="login.html" class="back-to-login">
                        <i class="fas fa-arrow-left"></i> Back to Login
                    </a>
                </form>
            </div>
        </div>
    </div>
    <script src="forgot-password.js"></script>
</body>
</html>
